name: Build Windows Installer

on:
  push:
    tags:
      - 'v*-win'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Windows icon
        run: python resources/generate_icon_win.py

      - name: Build with PyInstaller
        run: pyinstaller "Urban's Cannon (Windows).spec" --noconfirm --clean

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Urban-s-Cannon-VPS-Deployer-windows-installer
          path: dist/Urbans-Cannon-*-Windows-Setup.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Urbans-Cannon-*-Windows-Setup.exe
          generate_release_notes: true
